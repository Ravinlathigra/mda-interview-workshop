name: workshop checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked marimo check --strict lab/app.py
