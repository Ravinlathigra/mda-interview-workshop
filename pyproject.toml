[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mda-interview-workshop"
version = "2.0.0"
description = "Interactive technical interview workshop and SQL debugging lab"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "marimo>=0.25.2,<0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.setuptools.package-data]
lab = ["data/*.csv"]
